<main id="app"></main>

<script>
const STATUS_LABEL = { confirmed: "確定", tentative: "仮", candidates: "候補" };

function render() {
  const app = document.getElementById('app');
  const header = `
    <header class="hero">
      <p class="hero-eyebrow">${TRIP.dateRange}・${TRIP.people}</p>
      <h1>${TRIP.title}</h1>
      <div class="hero-facts">
        ${TRIP.flights.map(f => `
          <div class="fact">
            <span class="fact-label">${f.date} ${f.no}</span>
            <span class="fact-value">${f.route}　${f.dep} → ${f.arr}</span>
          </div>`).join('')}
        <div class="fact">
          <span class="fact-label">宿泊</span>
          <span class="fact-value">${TRIP.hotel.name}</span>
          <span class="fact-sub">${TRIP.hotel.detail}</span>
        </div>
      </div>
    </header>`;

  const nav = `
    <nav class="daynav" id="daynav">
      ${TRIP.days.map((d, i) => `<button class="daynav-btn${i===0?' active':''}" data-day="${i}">${d.label}<span>${d.date}</span></button>`).join('')}
    </nav>`;

  let uidCounter = 0;
  const days = TRIP.days.map((day, i) => `
    <section class="day${i===0?' active':''}" data-day="${i}">
      <div class="day-heading">
        <h2>${day.label} <span class="day-date">${day.date}</span></h2>
        <p class="day-theme">${day.theme}</p>
      </div>
      <ol class="timeline">
        ${day.items.map(item => renderItem(item, uidCounter++)).join('')}
      </ol>
    </section>`).join('');

  app.innerHTML = header + nav + `<div class="days">${days}</div>`;

  document.querySelectorAll('.daynav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = btn.dataset.day;
      activateDay(idx);
      try {
        history.replaceState(null, '', `#day${Number(idx) + 1}`);
      } catch (e) {
        // URL rewriting isn't permitted in some sandboxed preview
        // environments; the tab switch itself still works fine.
      }
    });
  });

  document.querySelectorAll('.transit-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = document.getElementById(btn.dataset.target);
      const open = !panel.hidden;
      panel.hidden = open;
      btn.setAttribute('aria-expanded', String(!open));
      btn.classList.toggle('is-open', !open);
    });
  });

  const hashMatch = location.hash.match(/day(\d+)/);
  if (hashMatch) {
    const idx = String(Number(hashMatch[1]) - 1);
    if (document.querySelector(`.daynav-btn[data-day="${idx}"]`)) activateDay(idx);
  }
}

function activateDay(idx) {
  document.querySelectorAll('.daynav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
  document.querySelector(`.daynav-btn[data-day="${idx}"]`).classList.add('active');
  document.querySelector(`.day[data-day="${idx}"]`).classList.add('active');
}

function renderItem(item, uid) {
  const badge = item.status !== 'confirmed' ? `<span class="badge badge-${item.status}">${STATUS_LABEL[item.status]}</span>` : '';
  const note = item.note ? `<p class="item-note">${item.note}</p>` : '';
  const options = item.options ? `<ul class="options">${item.options.map(o => `<li>${o}</li>`).join('')}</ul>` : '';
  const panelId = `transit-${uid}`;
  const transitToggle = item.transit ? `<button type="button" class="transit-toggle" data-target="${panelId}" aria-expanded="false">時刻表を見る <span class="chev">▾</span></button>` : '';
  const transitPanel = item.transit ? renderTransitPanel(item.transit, panelId) : '';
  return `
    <li class="item${item.highlight ? ' highlight' : ''}">
      <div class="item-time">${item.time}</div>
      <div class="item-dot"></div>
      <div class="item-body">
        <div class="item-title-row">
          <h3>${item.title}</h3>
          ${badge}
        </div>
        ${note}
        ${options}
        ${transitToggle}
        ${transitPanel}
      </div>
    </li>`;
}

function renderTransitPanel(transit, panelId) {
  const rows = (transit.around || []).map(r => `
    <div class="transit-row${r.self ? ' self' : ''}">
      <span class="transit-row-time">${r.time}</span>
      <span class="transit-row-train">${r.train}${r.dest ? '　' + r.dest : ''}</span>
      ${r.arr ? `<span class="transit-row-arr">${r.arr}着</span>` : ''}
    </div>`).join('');
  return `
    <div class="transit-panel" id="${panelId}" hidden>
      <p class="transit-headline">${transit.headline}</p>
      ${rows ? `<div class="transit-rows">${rows}</div>` : ''}
      <p class="transit-note">${transit.note}</p>
      ${transit.link ? `<a class="transit-link" href="${transit.link}" target="_blank" rel="noopener">公式サイトで最新の時刻を確認する →</a>` : ''}
    </div>`;
}

render();
</script>
