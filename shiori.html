<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>札幌・小樽 しおり(Web版) — グルメ・お土産・時刻表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<main id="app"><p class="loading">読み込み中…</p></main>

<script>
/* ============================================================
   このページの役割:
   紙のしおり(印刷版)に「だいたいの予定」は載っているので、
   Web版はその補助として、当日の判断に使う情報 ── グルメ候補・
   お土産候補・電車の時刻表・地図リンク ── だけをまとめてあります。
   データは trip_data.json（印刷版と共通）。
   ============================================================ */

const STATUS_LABEL = { confirmed: "確定", tentative: "仮", candidates: "候補" };
const STATE_KEY = 'athena-sapporo-otaru-state-v2';

let TRIP = null;
let STATE = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore corrupt state */ }
  return { checks: {}, expenses: {}, picks: {}, others: [] };
}
if (!Array.isArray(STATE.others)) STATE.others = [];
function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(STATE)); } catch (e) { /* storage unavailable */ }
}
function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function mapUrl(query) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}
function itemId(di, ii) { return `d${di}-i${ii}`; }
function itemById(id) {
  const m = /^d(\d+)-i(\d+)$/.exec(id);
  if (!m || !TRIP) return null;
  const day = TRIP.days[Number(m[1])];
  return day ? day.items[Number(m[2])] || null : null;
}

/* Picks are saved by option NAME, not by position, so options can be
   removed or reordered in trip_data.json without breaking saved picks.
   Older saves stored positions; they are converted once here. If an item
   has "legacyOptionNames", those names describe the old positions. */
function migratePicks() {
  let changed = false;
  Object.keys(STATE.picks || {}).forEach(id => {
    const picks = STATE.picks[id] || [];
    if (!picks.some(p => typeof p === 'number')) return;
    const item = itemById(id);
    const oldNames = (item && item.legacyOptionNames) || ((item && item.options) || []).map(o => o.name);
    STATE.picks[id] = [...new Set(picks
      .map(p => typeof p === 'number' ? oldNames[p] : p)
      .filter(Boolean))];
    changed = true;
  });
  if (changed) saveState();
}

function loadTripData(url, onSuccess, onError) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 || xhr.status === 0) {
          let parsed;
          try { parsed = JSON.parse(xhr.responseText); }
          catch (e) { onError(e); return; }
          onSuccess(parsed);
        } else {
          onError(new Error('HTTP ' + xhr.status));
        }
      }
    };
    xhr.send();
  } catch (e) {
    onError(e);
  }
}

loadTripData('./trip_data.json',
  data => { TRIP = data; migratePicks(); render(); },
  err => {
    console.error(err);
    document.getElementById('app').innerHTML =
      '<p class="loading">データの読み込みに失敗しました。ページを再読み込みしてください。<br>' +
      '(trip_data.json が同じフォルダに必要です)</p>';
  });

/* ---------- helpers to pull cross-day lists out of TRIP ---------- */

function collectByTag(tag) {
  const out = [];
  TRIP.days.forEach((day, di) => {
    day.items.forEach((item, ii) => {
      if ((item.tags || []).includes(tag)) out.push({ day, di, ii, item });
    });
  });
  return out;
}

function collectGourmet() {
  // the gourmet tab is for choosing among candidates — items with no
  // options are already decided and don't need a place here
  // also shows decided places that have a map link (the map tab was removed)
  return collectByTag('gourmet').filter(e => (e.item.options && e.item.options.length) || e.item.map);
}
function collectOmiyage() {
  const out = [];
  TRIP.days.forEach((day, di) => {
    day.items.forEach((item, ii) => {
      if ((item.tags || []).includes('omiyage')) out.push({ day, di, ii, item });
    });
  });
  return out;
}
function collectTransit() {
  const out = [];
  TRIP.days.forEach((day, di) => {
    day.items.forEach((item, ii) => {
      if (item.transit) out.push({ day, di, ii, item });
    });
  });
  return out;
}
/* ---------- render ---------- */

function render() {
  const app = document.getElementById('app');
  const header = `
    <header class="hero">
      <p class="hero-eyebrow">${TRIP.dateRange}・${TRIP.people}</p>
      <h1>${TRIP.title}</h1>
      <p class="hero-note">📄 大まかな予定は紙のしおりに記載しています。ここでは<strong>グルメ・お土産の候補(地図リンク付き)と電車の時刻表</strong>をまとめています。</p>
      <div class="hero-facts">
        ${TRIP.flights.map(f => `
          <div class="fact">
            <span class="fact-label">${f.date} ${f.no}</span>
            <span class="fact-value">${f.route}　${f.dep} → ${f.arr}</span>
          </div>`).join('')}
        <div class="fact">
          <span class="fact-label">宿泊</span>
          <span class="fact-value">${TRIP.hotel.name}</span>
        </div>
        ${(!TRIP.weatherDays && TRIP.weather) ? `
        <div class="fact">
          <span class="fact-label">天気予報</span>
          <span class="fact-value">${TRIP.weather}</span>
        </div>` : ''}
      </div>
      ${renderWeather()}
    </header>`;

  const tabs = [
    { id: 'gourmet', label: 'グルメ', icon: '🍽' },
    { id: 'omiyage', label: 'お土産', icon: '🎁' },
    { id: 'transit', label: '時刻表', icon: '🚃' },
    { id: 'budget', label: '予算', icon: '💰' },
  ];
  const nav = `
    <nav class="tabnav" id="tabnav">
      ${tabs.map((t, i) => `<button class="tabnav-btn${i === 0 ? ' active' : ''}" data-tab="${t.id}"><span class="tabnav-icon">${t.icon}</span>${t.label}</button>`).join('')}
    </nav>`;

  const panels = `
    <div class="panels">
      <section class="panel active" data-tab="gourmet">${renderGourmetPanel()}</section>
      <section class="panel" data-tab="omiyage">${renderOmiyagePanel()}</section>
      <section class="panel" data-tab="transit">${renderTransitPanelTab()}</section>
      <section class="panel" data-tab="budget">${renderBudgetPanel()}</section>
    </div>`;

  app.innerHTML = header + nav + panels;
  attachHandlers();
  updateTotals();
}

function dayChip(day) {
  return `<span class="day-chip">${day.label}・${day.date}</span>`;
}

function renderWeather() {
  const days = TRIP.weatherDays;
  if (!days || !days.length) return '';
  const cards = days.map(w => `
    <div class="wx-day">
      <span class="wx-date">${w.label}・${w.date}</span>
      <span class="wx-icon">${w.icon || ''}</span>
      <span class="wx-sky">${w.sky}</span>
      <span class="wx-temp"><b>${w.high}℃</b> / ${w.low}℃</span>
      <span class="wx-pop">☂ ${w.pop}</span>
      ${w.note ? `<span class="wx-note">${w.note}</span>` : ''}
    </div>`).join('');
  return `
    <div class="wx">
      <div class="wx-head"><span>天気予報</span>${TRIP.weatherAsOf ? `<span class="wx-asof">${TRIP.weatherAsOf}</span>` : ''}</div>
      <div class="wx-grid">${cards}</div>
      ${TRIP.weatherNote ? `<p class="wx-footnote">${TRIP.weatherNote}</p>` : ''}
    </div>`;
}

function renderGourmetPanel() {
  const entries = collectGourmet();
  const cards = entries.map(({ day, di, ii, item }) => {
    const id = itemId(di, ii);
    const badge = item.status !== 'confirmed' ? `<span class="badge badge-${item.status}">${STATUS_LABEL[item.status]}</span>` : '';
    const note = item.note ? `<p class="card-note">${item.note}</p>` : '';
    const options = item.options ? renderOptionPicker(item.options, id, true) : '';
    const placeMap = item.map ? `<a class="map-link" href="${mapUrl(item.map)}" target="_blank" rel="noopener">📍 地図</a>` : '';
    return `
      <li class="card" data-id="${id}">
        <div class="card-top">
          ${dayChip(day)}
          <span class="card-time">${item.time}</span>
        </div>
        <div class="card-title-row">
          <h3>${item.title}</h3>
          ${badge}
          ${placeMap}
        </div>
        ${note}
        ${options}
      </li>`;
  }).join('');
  return `<ul class="card-list">${cards}</ul>`;
}

function renderOptionPicker(options, id, showMap) {
  const picks = STATE.picks[id] || [];
  const rows = options.map((opt, oi) => {
    const picked = picks.includes(opt.name);
    const mapLink = (showMap && opt.map) ? `<a class="map-link" href="${mapUrl(opt.map)}" target="_blank" rel="noopener">📍 地図</a>` : '';
    return `
      <li class="option-row${picked ? ' picked' : ''}">
        <button type="button" class="pick-btn" data-id="${id}" data-oi="${oi}" aria-pressed="${picked}">
          ${picked ? '✓ 選んだ' : '選ぶ'}
        </button>
        <span class="option-name">${opt.name}</span>
        ${mapLink}
      </li>`;
  }).join('');
  return `<ul class="options">${rows}</ul>`;
}

function renderOmiyagePanel() {
  const entries = collectOmiyage();
  if (!entries.length) return `<p class="empty">お土産の候補はまだありません。</p>`;
  return entries.map(({ day, di, ii, item }) => {
    const id = itemId(di, ii);
    const picks = STATE.picks[id] || [];
    const options = item.options || [];
    const note = item.note ? `<p class="omiyage-note">${item.note}</p>` : '';
    const priceNote = item.priceNote ? `<p class="omiyage-note">💴 ${item.priceNote}</p>` : '';

    // saved picks refer to option names; groups are only a display concern
    const cardHtml = (opt, oi) => {
      const picked = picks.includes(opt.name);
      const img = opt.image
        ? `<img class="omiyage-img" src="${opt.image}" alt="${opt.name}" loading="lazy">`
        : `<div class="omiyage-img omiyage-img-empty">📷</div>`;
      const mapLink = opt.map ? `<a class="map-link" href="${mapUrl(opt.map)}" target="_blank" rel="noopener">📍 地図</a>` : '';
      const brand = opt.brand ? `<p class="omiyage-brand">${opt.brand}</p>` : '';
      const desc = opt.note ? `<p class="omiyage-desc">${opt.note}</p>` : '';
      const warn = opt.warn ? `<p class="omiyage-warn">⚠ ${opt.warn}</p>` : '';
      const price = opt.price
        ? `<p class="omiyage-price">${opt.price}</p>`
        : `<p class="omiyage-price omiyage-price-unknown">価格は店頭で確認</p>`;
      return `
        <li class="omiyage-card${picked ? ' picked' : ''}">
          <div class="omiyage-imgwrap">
            ${img}
            ${picked ? '<span class="omiyage-badge">✓ 選んだ</span>' : ''}
          </div>
          <div class="omiyage-body">
            <h4 class="omiyage-name">${opt.name}</h4>
            ${brand}
            ${price}
            ${desc}
            ${warn}
            <div class="omiyage-actions">
              <button type="button" class="pick-btn" data-id="${id}" data-oi="${oi}" aria-pressed="${picked}">${picked ? '✓ 選んだ' : '選ぶ'}</button>
              ${mapLink}
            </div>
          </div>
        </li>`;
    };

    const groups = (item.groups && item.groups.length) ? item.groups : [{ id: '', title: '' }];
    const firstId = groups[0].id;
    const sections = groups.map(g => {
      const cards = options
        .map((opt, oi) => ({ opt, oi }))
        .filter(({ opt }) => (opt.group || firstId) === g.id)
        .map(({ opt, oi }) => cardHtml(opt, oi))
        .join('');
      if (!cards) return '';
      const title = g.title ? `<h4 class="omiyage-group-title">${g.title}</h4>` : '';
      const gnote = g.note ? `<p class="omiyage-group-note">${g.note}</p>` : '';
      return `<div class="omiyage-group">${title}${gnote}<ul class="omiyage-grid">${cards}</ul></div>`;
    }).join('');

    return `
      <div class="omiyage-head">
        <div class="card-top">${dayChip(day)}<span class="card-time">${item.time}</span></div>
        <h3>${item.title}</h3>
        ${note}
        ${priceNote}
      </div>
      ${sections}`;
  }).join('');
}

function renderTransitPanelTab() {
  const entries = collectTransit();
  if (!entries.length) return `<p class="empty">時刻表情報はまだありません。</p>`;
  const cards = entries.map(({ day, item }) => {
    const t = item.transit;
    const rows = (t.around || []).map(r => `
      <div class="transit-row${r.self ? ' self' : ''}">
        <span class="transit-row-time">${r.time}</span>
        <span class="transit-row-train">${r.train}${r.dest ? '　' + r.dest : ''}</span>
        ${r.arr ? `<span class="transit-row-arr">${r.arr}着</span>` : ''}
      </div>`).join('');
    return `
      <li class="card transit-card">
        <div class="card-top">${dayChip(day)}<span class="card-time">${item.time} ${item.title}</span></div>
        <p class="transit-headline">${t.headline}</p>
        ${rows ? `<div class="transit-rows">${rows}</div>` : ''}
        <p class="transit-note">${t.note}</p>
        ${t.link ? `<a class="transit-link" href="${t.link}" target="_blank" rel="noopener">公式サイトで最新の時刻を確認する →</a>` : ''}
      </li>`;
  }).join('');
  return `<ul class="card-list">${cards}</ul>`;
}

function budgetRow(item, id) {
  const val = STATE.expenses[id] || '';
  return `
    <li class="budget-row">
      <div class="budget-row-main">
        <span class="budget-row-time">${item.time}</span>
        <span class="budget-row-title">${item.title}</span>
      </div>
      <div class="expense-row">
        <span class="expense-yen">¥</span>
        <input type="number" inputmode="numeric" class="expense-input" data-id="${id}" placeholder="0" min="0" step="100" value="${val}">
      </div>
    </li>`;
}

function renderBudgetPanel() {
  const transportEntries = collectByTag('transport');
  const spendEntries = [...collectByTag('gourmet'), ...collectByTag('omiyage')];

  const transportRows = transportEntries.map(({ di, ii, item }) => budgetRow(item, itemId(di, ii))).join('');
  const spendRows = spendEntries.map(({ di, ii, item }) => budgetRow(item, itemId(di, ii))).join('');

  return `
    <div class="budget-summary">
      <div class="budget-grand"><span>ここまでの合計</span><strong id="budget-grand-total">¥0</strong></div>
      <div class="budget-days budget-days-cat">
        <div class="budget-day-chip"><span>🚕 交通費</span><strong id="budget-transport-total">¥0</strong></div>
        <div class="budget-day-chip"><span>🍽 買い物・食事</span><strong id="budget-spend-total">¥0</strong></div>
        <div class="budget-day-chip"><span>🧾 その他</span><strong id="budget-other-total">¥0</strong></div>
      </div>
      <div class="budget-days budget-days-byday">
        ${TRIP.days.map((day, di) => `
          <div class="budget-day-chip budget-day-chip-sm"><span>${day.label}</span><strong id="budget-day-total-${di}">¥0</strong></div>`).join('')}
      </div>
    </div>
    <div class="budget-columns">
      <div class="budget-col">
        <h3 class="budget-col-heading">🚕 交通費</h3>
        <ul class="budget-list">${transportRows}</ul>
      </div>
      <div class="budget-col">
        <h3 class="budget-col-heading">🍽 買い物・食事</h3>
        <ul class="budget-list">${spendRows}</ul>
      </div>
    </div>
    ${renderOtherBudget()}`;
}

/* 「その他」: しおりに無い出費(ホテル代・コインロッカー・予備費など)を自由に足せる */
function renderOtherBudget() {
  const dayOpts = sel => `<option value=""${sel === '' || sel == null ? ' selected' : ''}>日付なし</option>` +
    TRIP.days.map((day, di) => `<option value="${di}"${String(sel) === String(di) ? ' selected' : ''}>${day.label}</option>`).join('');
  const rows = STATE.others.map(o => `
    <li class="other-row" data-oid="${esc(o.id)}">
      <input type="text" class="other-name" data-oid="${esc(o.id)}" placeholder="項目名(例: ホテル代)" value="${esc(o.name)}">
      <div class="other-sub">
        <select class="other-day" data-oid="${esc(o.id)}">${dayOpts(o.day)}</select>
        <div class="expense-row">
          <span class="expense-yen">¥</span>
          <input type="number" inputmode="numeric" class="expense-input other-amount" data-oid="${esc(o.id)}" placeholder="0" min="0" step="100" value="${o.amount == null ? '' : o.amount}">
        </div>
        <button type="button" class="other-del" data-oid="${esc(o.id)}" aria-label="この行を削除">削除</button>
      </div>
    </li>`).join('');
  return `
    <div class="budget-other">
      <h3 class="budget-col-heading">🧾 その他</h3>
      <p class="budget-other-help">ホテル代・コインロッカー・予備費など、上に無い出費を追加できます。</p>
      ${rows ? `<ul class="budget-list">${rows}</ul>` : ''}
      <button type="button" class="other-add">＋ 項目を追加</button>
    </div>`;
}

/* ---------- interactivity ---------- */

function attachHandlers() {
  document.querySelectorAll('.tabnav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tabnav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.panel[data-tab="${tab}"]`).classList.add('active');
      try { history.replaceState(null, '', `#${tab}`); } catch (e) { /* sandboxed preview */ }
    });
  });

  document.querySelectorAll('.check').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.id;
      STATE.checks[id] = cb.checked;
      saveState();
      cb.closest('.card').classList.toggle('done', cb.checked);
    });
  });

  document.querySelectorAll('.expense-input:not(.other-amount)').forEach(inp => {
    inp.addEventListener('input', () => {
      const id = inp.dataset.id;
      const val = inp.value === '' ? null : Number(inp.value);
      if (val === null || isNaN(val)) delete STATE.expenses[id];
      else STATE.expenses[id] = val;
      saveState();
      // keep every input for this same item (gourmet tab + budget tab) in sync
      document.querySelectorAll(`.expense-input[data-id="${id}"]`).forEach(other => {
        if (other !== inp) other.value = inp.value;
      });
      updateTotals();
    });
  });

  document.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const oi = Number(btn.dataset.oi);
      const item = itemById(id);
      const opt = item && item.options ? item.options[oi] : null;
      if (!opt) return;
      const picks = STATE.picks[id] || [];
      STATE.picks[id] = picks.includes(opt.name) ? picks.filter(x => x !== opt.name) : [...picks, opt.name];
      saveState();
      const scrollY = window.scrollY;
      render();
      const hash = location.hash.replace('#', '');
      if (hash) {
        const tabBtn = document.querySelector(`.tabnav-btn[data-tab="${hash}"]`);
        if (tabBtn) tabBtn.click();
      }
      window.scrollTo(0, scrollY);
    });
  });

  attachOtherHandlers();
  openFromHash();
}

function rerenderKeepingPlace(tab) {
  const scrollY = window.scrollY;
  render();
  const btn = document.querySelector(`.tabnav-btn[data-tab="${tab}"]`);
  if (btn) btn.click();
  window.scrollTo(0, scrollY);
}

function attachOtherHandlers() {
  const find = id => STATE.others.find(o => o.id === id);
  const add = document.querySelector('.other-add');
  if (add) add.addEventListener('click', () => {
    STATE.others.push({ id: 'o' + Date.now(), name: '', amount: null, day: '' });
    saveState();
    rerenderKeepingPlace('budget');
    const inputs = document.querySelectorAll('.other-name');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });
  document.querySelectorAll('.other-name').forEach(inp => inp.addEventListener('input', () => {
    const o = find(inp.dataset.oid); if (!o) return;
    o.name = inp.value; saveState();
  }));
  document.querySelectorAll('.other-amount').forEach(inp => inp.addEventListener('input', () => {
    const o = find(inp.dataset.oid); if (!o) return;
    const v = inp.value === '' ? null : Number(inp.value);
    o.amount = (v === null || isNaN(v)) ? null : v;
    saveState(); updateTotals();
  }));
  document.querySelectorAll('.other-day').forEach(sel => sel.addEventListener('change', () => {
    const o = find(sel.dataset.oid); if (!o) return;
    o.day = sel.value; saveState(); updateTotals();
  }));
  document.querySelectorAll('.other-del').forEach(btn => btn.addEventListener('click', () => {
    const o = find(btn.dataset.oid); if (!o) return;
    if (!confirm(`「${o.name || '名前なし'}」を削除しますか?`)) return;
    STATE.others = STATE.others.filter(x => x.id !== o.id);
    saveState();
    rerenderKeepingPlace('budget');
  }));
}

/* The printed shiori's QR codes open "#day1" / "#day2" / "#day3".
   Those are not tabs, so send each day to the tab that holds its
   candidates (gourmet first, then souvenirs, then timetable) and
   scroll to that day's first card. Tab names like "#omiyage" still work. */
function openFromHash() {
  const hash = location.hash.replace('#', '');
  if (!hash) return;
  const clickTab = tab => {
    const btn = document.querySelector(`.tabnav-btn[data-tab="${tab}"]`);
    if (btn) btn.click();
    return !!btn;
  };
  const m = /^day(\d+)$/.exec(hash);
  if (!m) { clickTab(hash); return; }
  const di = Number(m[1]) - 1;
  const onDay = list => list.find(e => e.di === di);
  const gourmetChoices = collectGourmet().filter(e => e.item.options && e.item.options.length);
  const target =
    (onDay(gourmetChoices) && { tab: 'gourmet', entry: onDay(gourmetChoices) }) ||
    (onDay(collectOmiyage()) && { tab: 'omiyage', entry: null }) ||
    (onDay(collectTransit()) && { tab: 'transit', entry: null });
  if (!target) return;
  clickTab(target.tab);
  if (target.entry) {
    const card = document.querySelector(`.panel[data-tab="gourmet"] .card[data-id="${itemId(target.entry.di, target.entry.ii)}"]`);
    if (card) setTimeout(() => card.scrollIntoView({ block: 'start' }), 0);
  }
}

function updateTotals() {
  const transportIds = new Set(collectByTag('transport').map(e => itemId(e.di, e.ii)));
  const spendIds = new Set([...collectByTag('gourmet'), ...collectByTag('omiyage')].map(e => itemId(e.di, e.ii)));
  let total = 0, transportTotal = 0, spendTotal = 0;
  Object.entries(STATE.expenses).forEach(([id, v]) => {
    if (typeof v !== 'number' || isNaN(v)) return;
    total += v;
    if (transportIds.has(id)) transportTotal += v;
    if (spendIds.has(id)) spendTotal += v;
  });
  const set = (elId, val) => { const el = document.getElementById(elId); if (el) el.textContent = `¥${val.toLocaleString()}`; };
  let otherTotal = 0;
  const otherByDay = {};
  STATE.others.forEach(o => {
    if (typeof o.amount !== 'number' || isNaN(o.amount)) return;
    otherTotal += o.amount;
    if (o.day !== '' && o.day != null) otherByDay[o.day] = (otherByDay[o.day] || 0) + o.amount;
  });
  total += otherTotal;
  set('budget-other-total', otherTotal);
  set('budget-grand-total', total);
  set('budget-transport-total', transportTotal);
  set('budget-spend-total', spendTotal);

  TRIP.days.forEach((day, di) => {
    let dayTotal = 0;
    day.items.forEach((item, ii) => {
      const v = STATE.expenses[itemId(di, ii)];
      if (typeof v === 'number' && !isNaN(v)) dayTotal += v;
    });
    dayTotal += otherByDay[String(di)] || 0;
    set(`budget-day-total-${di}`, dayTotal);
  });
}
